<ng-container *ngIf="item as p">
  <!-- Breadcrumb -->
  <div class="border-b border-ink-100 bg-ink-50/60">
    <div class="container-page flex items-center gap-2 py-4 text-sm text-ink-500">
      <a routerLink="/" class="hover:text-brand-600">Home</a>
      <app-icon name="chevron-right" [size]="14"></app-icon>
      <a routerLink="/portfolio" class="hover:text-brand-600">Portfolio</a>
      <app-icon name="chevron-right" [size]="14"></app-icon>
      <span class="font-medium text-ink-800">{{ p.title }}</span>
    </div>
  </div>

  <!-- Hero -->
  <section class="py-16 sm:py-20">
    <div class="container-page grid grid-cols-1 items-center gap-12 lg:grid-cols-2">
      <div>
        <div class="flex items-center gap-3">
          <span class="flex h-12 w-12 items-center justify-center rounded-xl" [class]="p.accent">
            <app-icon [name]="p.icon" [size]="22" [strokeWidth]="1.8"></app-icon>
          </span>
          <span
            class="rounded-full px-2.5 py-1 text-[11px] font-semibold"
            [class]="p.status === 'Completed' ? 'bg-emerald-50 text-emerald-600' : 'bg-brand-50 text-brand-600'"
            >{{ p.status }}</span
          >
        </div>
        <h1 class="mt-6 text-4xl font-extrabold tracking-tight text-ink-900 sm:text-5xl">{{ p.title }}</h1>
        <p class="mt-2 text-sm font-semibold uppercase tracking-wide text-ink-400">{{ p.category }}</p>
        <p class="mt-5 max-w-lg text-lg leading-relaxed text-ink-500">{{ p.description }}</p>
        <a routerLink="/contact" class="btn-primary mt-8">
          Start a Project
          <app-icon name="arrow-right" [size]="16" [strokeWidth]="2.2"></app-icon>
        </a>
      </div>

      <div class="relative overflow-hidden">
        <div class="absolute -right-8 -top-8 h-40 w-40 rounded-full bg-brand-100/60 blur-3xl"></div>
        <div
          class="relative flex aspect-[4/3] flex-col items-center justify-center gap-3 rounded-3xl bg-gradient-to-br from-ink-900 to-ink-950 shadow-panel"
        >
          <span class="flex h-16 w-16 items-center justify-center rounded-2xl text-white" [class]="p.accent">
            <app-icon [name]="p.icon" [size]="30" [strokeWidth]="1.6"></app-icon>
          </span>
          <p class="text-xl font-bold text-white">{{ p.client }}</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Results -->
  <section class="border-y border-ink-100 bg-ink-50/60 py-20 sm:py-24">
    <div class="container-page">
      <h2 class="text-2xl font-bold text-ink-900 sm:text-3xl">What We Delivered</h2>
      <div class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-3">
        <div *ngFor="let result of p.results" class="flex items-start gap-3 rounded-2xl bg-white p-5 shadow-card">
          <app-icon name="check-circle" [size]="20" [strokeWidth]="1.8" class="mt-0.5 shrink-0 text-brand-600"></app-icon>
          <span class="text-sm leading-relaxed text-ink-700">{{ result }}</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Other projects -->
  <section class="py-20 sm:py-24" *ngIf="otherProjects.length">
    <div class="container-page">
      <h2 class="text-2xl font-bold text-ink-900 sm:text-3xl">More Projects</h2>
      <div class="mt-8 grid grid-cols-1 gap-5 sm:grid-cols-3">
        <a
          *ngFor="let other of otherProjects"
          [routerLink]="['/portfolio', other.slug]"
          class="card group transition-shadow hover:shadow-panel"
        >
          <span class="flex h-11 w-11 items-center justify-center rounded-xl" [class]="other.accent">
            <app-icon [name]="other.icon" [size]="20" [strokeWidth]="1.8"></app-icon>
          </span>
          <h3 class="mt-4 text-sm font-bold text-ink-900">{{ other.title }}</h3>
          <span class="link-arrow mt-3">
            View case study
            <app-icon name="arrow-right" [size]="14" [strokeWidth]="2.2"></app-icon>
          </span>
        </a>
      </div>
    </div>
  </section>

  <!-- CTA -->
  <section class="pb-20 sm:pb-24">
    <div class="container-page">
      <app-cta-banner
        heading="Let's Build Something Like This"
        subtext="Tell us about your project and let's put together a plan."
        buttonText="Get Started"
        buttonLink="/contact"
      ></app-cta-banner>
    </div>
  </section>
</ng-container>
