<!-- Breadcrumb -->
<div class="border-b border-ink-100 bg-ink-50/60">
  <div class="container-page flex items-center gap-2 py-4 text-sm text-ink-500">
    <a routerLink="/" class="hover:text-brand-600">Home</a>
    <app-icon name="chevron-right" [size]="14"></app-icon>
    <span class="font-medium text-ink-800">Portfolio</span>
  </div>
</div>

<!-- Hero -->
<section class="py-16 sm:py-20">
  <div class="container-page max-w-2xl">
    <h1 class="text-4xl font-extrabold tracking-tight text-ink-900 sm:text-5xl">
      Work We're <span class="text-brand-600">Proud Of</span>
    </h1>
    <p class="mt-5 text-lg leading-relaxed text-ink-500">
      A selection of products we've designed, built and shipped for startups and growing
      businesses.
    </p>
  </div>
</section>

<!-- Filters + grid -->
<section class="pb-20 sm:pb-24">
  <div class="container-page">
    <div class="flex flex-wrap gap-2">
      <button
        *ngFor="let category of categories"
        type="button"
        (click)="setCategory(category)"
        class="rounded-full px-4 py-2 text-sm font-semibold transition-colors"
        [class]="
          activeCategory === category
            ? 'bg-brand-600 text-white'
            : 'bg-ink-50 text-ink-600 hover:bg-ink-100'
        "
      >
        {{ category }}
      </button>
    </div>

    <div class="mt-10 grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
      <a
        *ngFor="let item of filtered"
        [routerLink]="['/portfolio', item.slug]"
        class="card flex flex-col transition-shadow hover:shadow-panel"
      >
        <div class="flex items-start justify-between">
          <span class="flex h-12 w-12 items-center justify-center rounded-xl" [class]="item.accent">
            <app-icon [name]="item.icon" [size]="22" [strokeWidth]="1.8"></app-icon>
          </span>
          <span
            class="rounded-full px-2.5 py-1 text-[11px] font-semibold"
            [class]="
              item.status === 'Completed' ? 'bg-emerald-50 text-emerald-600' : 'bg-brand-50 text-brand-600'
            "
            >{{ item.status }}</span
          >
        </div>
        <h3 class="mt-5 text-base font-bold text-ink-900">{{ item.title }}</h3>
        <p class="mt-1 text-xs font-semibold uppercase tracking-wide text-ink-400">{{ item.category }}</p>
        <p class="mt-3 flex-1 text-sm leading-relaxed text-ink-500">{{ item.summary }}</p>
        <span class="link-arrow mt-4">
          View case study
          <app-icon name="arrow-right" [size]="14" [strokeWidth]="2.2"></app-icon>
        </span>
      </a>
    </div>
  </div>
</section>

<!-- CTA -->
<section class="pb-20 sm:pb-24">
  <div class="container-page">
    <app-cta-banner
      heading="Have a Project in Mind?"
      subtext="Let's talk about what you're building — and how we can help."
      buttonText="Start a Conversation"
      buttonLink="/contact"
      tone="navy"
    ></app-cta-banner>
  </div>
</section>
