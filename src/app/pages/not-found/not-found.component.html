<section class="flex min-h-[60vh] items-center justify-center py-20">
  <div class="container-page flex flex-col items-center text-center">
    <span class="flex h-16 w-16 items-center justify-center rounded-2xl bg-brand-50 text-brand-600">
      <app-icon name="compass" [size]="30" [strokeWidth]="1.6"></app-icon>
    </span>
    <h1 class="mt-6 text-3xl font-extrabold tracking-tight text-ink-900 sm:text-4xl">Page Not Found</h1>
    <p class="mt-3 max-w-md text-base leading-relaxed text-ink-500">
      The page you're looking for doesn't exist or may have been moved.
    </p>
    <a routerLink="/" class="btn-primary mt-8">
      Back to Home
      <app-icon name="arrow-right" [size]="16" [strokeWidth]="2.2"></app-icon>
    </a>
  </div>
</section>
